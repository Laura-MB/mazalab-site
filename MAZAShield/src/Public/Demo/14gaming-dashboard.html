<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZAShield • Casino Risk Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    
    body { font-family: 'Inter', system-ui, sans-serif; }
    .title-font { font-family: 'Playfair Display', serif; }

    .light { background-color: #f8f9f0 !important; color: #1a1a1a !important; }
    .light .bg-zinc-900, .light .bg-zinc-800 { background-color: #f1f5eb !important; }
    .light .text-white { color: #1a1a1a !important; }
    .light .text-zinc-400 { color: #555 !important; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen transition-all duration-300">

  <!-- Ribbon -->
  <div class="bg-zinc-900 border-b border-zinc-700 py-3 text-center">
    <div class="inline-flex items-center gap-3 text-xl font-light tracking-widest">
      <span class="font-bold">MAZAShield</span>
      <span class="text-xs text-zinc-500">by MAZALab</span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-8">
    <!-- Header -->
    <div class="flex justify-between items-end mb-12">
      <div>
        <h1 class="title-font text-7xl font-bold tracking-tighter text-white">MAZAShield</h1>
        <p class="text-2xl text-zinc-400 mt-1">Casino Risk Intelligence • Live Operations</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Language -->
        <div class="flex border border-zinc-700 rounded-3xl overflow-hidden">
          <button onclick="setLang('en')" id="lang-en" class="lang-btn px-6 py-3 hover:bg-zinc-800">EN</button>
          <button onclick="setLang('es')" id="lang-es" class="lang-btn px-6 py-3 hover:bg-zinc-800 bg-zinc-700 text-white">ES</button>
          <button onclick="setLang('pt')" id="lang-pt" class="lang-btn px-6 py-3 hover:bg-zinc-800">PT</button>
        </div>

        <!-- Theme -->
        <button onclick="toggleTheme()" class="w-12 h-12 flex items-center justify-center bg-zinc-900 hover:bg-zinc-800 rounded-2xl text-2xl transition-all">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>

        <!-- Download -->
        <button onclick="toggleDownloadMenu()" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-4 rounded-3xl font-medium flex items-center gap-2 transition">
          <i class="fas fa-download"></i> Download Report
        </button>

        <!-- Run Demo -->
        <button onclick="runFullDemo()" class="bg-emerald-600 hover:bg-emerald-700 px-8 py-4 rounded-3xl font-semibold flex items-center gap-3 transition">
          <i class="fas fa-play"></i> RUN FULL DEMO
        </button>
      </div>
    </div>

    <!-- KPI Strip -->
    <div id="kpi-strip" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12"></div>

    <!-- Results -->
    <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <script>
    let currentLang = 'es';

    const translations = {
      en: { run: "RUN FULL DEMO", download: "Download Report" },
      es: { run: "EJECUTAR DEMO COMPLETA", download: "Descargar Reporte" },
      pt: { run: "EXECUTAR DEMO COMPLETA", download: "Baixar Relatório" }
    };

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('demo-text').textContent = translations[lang].run;
      document.getElementById('download-text').textContent = translations[lang].download;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('bg-zinc-700', btn.textContent.toLowerCase() === lang);
        btn.classList.toggle('text-white', btn.textContent.toLowerCase() === lang);
      });
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light');
      const icon = document.getElementById('theme-icon');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    }

    function toggleDownloadMenu() {
      const options = confirm("¿Qué reporte deseas descargar?\n\n1. Brief Report (resumen)\n2. Full Report (completo con auditoría)\n\nEscribe 1 o 2:");
      if (options === "1" || options === "2") {
        alert(`✅ Reporte ${options === "1" ? "Brief" : "Full"} generado.\n\n(En producción se descargará como PDF en modo light).`);
      }
    }

    function runFullDemo() {
      const results = document.getElementById('results');
      results.classList.remove('hidden');
      results.innerHTML = `
        <div class="bg-zinc-900 border border-amber-500/30 rounded-3xl p-8 hover:border-amber-500 transition">
          <div class="flex justify-between">
            <div>
              <h3 class="text-2xl font-semibold">Marcus Vega</h3>
              <p class="text-amber-400 text-xl font-bold mt-2">94</p>
            </div>
            <div class="text-right">
              <span class="px-4 py-1 bg-amber-500/10 text-amber-400 rounded-full text-sm">HIGH</span>
            </div>
          </div>
          <p class="mt-6 text-zinc-400">Promo Rail Stack + Alias Network + Velocity Spike</p>
          <div class="mt-6 flex gap-3">
            <button onclick="alert('Abriendo Playbook para Marcus Vega...')" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Ver Playbook</button>
          </div>
        </div>

        <div class="bg-zinc-900 border border-red-500/30 rounded-3xl p-8 hover:border-red-500 transition">
          <div class="flex justify-between">
            <div>
              <h3 class="text-2xl font-semibold">Elena Frost</h3>
              <p class="text-red-400 text-xl font-bold mt-2">91</p>
            </div>
            <div class="text-right">
              <span class="px-4 py-1 bg-red-500/10 text-red-400 rounded-full text-sm">CRITICAL</span>
            </div>
          </div>
          <p class="mt-6 text-zinc-400">Session Tilt + RG Breach + High Stakes Pattern</p>
          <div class="mt-6 flex gap-3">
            <button onclick="alert('Abriendo Playbook para Elena Frost...')" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Ver Playbook</button>
          </div>
        </div>
      `;
    }

    // Inicializar
    document.getElementById('demo-text').textContent = translations[currentLang].run;
    document.getElementById('download-text').textContent = translations[currentLang].download;
  </script>
</body>
</html>
