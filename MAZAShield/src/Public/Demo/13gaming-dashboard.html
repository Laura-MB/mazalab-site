<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZAShield • Gaming Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen transition-all">

  <!-- Top Ribbon -->
  <div class="bg-zinc-900 border-b border-zinc-700 py-3 text-center">
    <div class="inline-flex items-center gap-3 text-2xl font-light tracking-widest">
      <span class="font-bold text-white">MAZAShield</span>
      <span class="text-xs text-zinc-500 align-super">by MAZALab</span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-8">
    <div class="flex justify-between items-center mb-12">
      <div>
        <h1 id="main-title" class="text-6xl font-bold tracking-tighter">MAZAShield</h1>
        <p class="text-zinc-400 text-2xl mt-1">Casino Risk Intelligence • Live Operations</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Language -->
        <div class="flex border border-zinc-700 rounded-3xl overflow-hidden">
          <button onclick="setLang('en')" id="lang-en" class="lang-btn px-5 py-3 hover:bg-zinc-800">EN</button>
          <button onclick="setLang('es')" id="lang-es" class="lang-btn px-5 py-3 hover:bg-zinc-800 bg-zinc-700 text-white">ES</button>
          <button onclick="setLang('pt')" id="lang-pt" class="lang-btn px-5 py-3 hover:bg-zinc-800">PT</button>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" 
                class="w-12 h-12 flex items-center justify-center bg-zinc-900 hover:bg-zinc-800 rounded-2xl text-2xl transition-all">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>

        <!-- Download Report -->
        <button onclick="toggleReportMenu()" 
                class="bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-4 rounded-3xl font-medium flex items-center gap-2 transition">
          <i class="fas fa-download"></i> <span id="download-text">Download Report</span>
        </button>

        <!-- Run Demo -->
        <button onclick="runFullDemo()" 
                class="bg-zinc-800 hover:bg-zinc-700 text-white px-8 py-4 rounded-3xl font-semibold flex items-center gap-3 transition">
          <i class="fas fa-play"></i> <span id="demo-text">RUN DEMO</span>
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <script>
    // Translations
    const translations = {
      en: { demo: "RUN DEMO", download: "Download Report" },
      es: { demo: "EJECUTAR DEMO", download: "Descargar Reporte" },
      pt: { demo: "EXECUTAR DEMO", download: "Baixar Relatório" }
    };

    let currentLang = 'es';

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('demo-text').textContent = translations[lang].demo;
      document.getElementById('download-text').textContent = translations[lang].download;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('bg-zinc-700', 'text-white');
        if (btn.textContent.toLowerCase() === lang) btn.classList.add('bg-zinc-700', 'text-white');
      });
    }

    // Theme Toggle - FIXED
    function toggleTheme() {
      const html = document.documentElement;
      const isLight = html.classList.toggle('light');
      const icon = document.getElementById('theme-icon');
      
      if (isLight) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
      }
    }

    function toggleReportMenu() {
      alert("📄 Opciones de reporte:\n\n• Brief Report\n• Full Report\n\n(En producción se descargarán PDFs)");
    }

    function downloadReport() {
      alert("📄 Descargando reporte...");
    }

    function runFullDemo() {
      const results = document.getElementById('results');
      results.classList.remove('hidden');
      results.innerHTML = `
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <h3 class="text-emerald-400">Player #87421</h3>
          <p class="text-6xl font-bold text-red-500 mt-4">92</p>
          <p class="text-zinc-400 mt-2">Chip Dumping + Alias Network</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <h3 class="text-emerald-400">Player #31902</h3>
          <p class="text-6xl font-bold text-amber-400 mt-4">85</p>
          <p class="text-zinc-400 mt-2">Session Tilt Detected</p>
        </div>
      `;
    }
  </script>
</body>
</html>
