<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZAShield • Gaming Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- Top Ribbon -->
  <div class="bg-zinc-900 border-b border-zinc-700 py-3 text-center">
    <div class="inline-flex items-center gap-3 text-2xl font-light tracking-widest">
      <span class="font-bold text-white">MAZA</span>
      <span class="font-thin text-zinc-300">SHIELD</span>
      <span class="text-xs text-zinc-500 align-super">by MAZALab</span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-8">
    <!-- Main Header -->
    <div class="flex justify-between items-center mb-12">
      <div>
        <h1 class="text-6xl font-bold tracking-tighter">
          <span class="font-bold">MAZA</span><span class="font-thin text-zinc-300">SHIELD</span>
        </h1>
        <p class="text-zinc-400 text-2xl mt-1">Casino Risk Intelligence • Live Operations</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Run Demo -->
        <button onclick="runFullDemo()" 
                class="bg-white text-black px-10 py-4 rounded-3xl font-semibold text-lg flex items-center gap-3 hover:bg-gray-100 transition">
          <i class="fas fa-play"></i> RUN DEMO
        </button>

        <!-- Download Reports -->
        <button onclick="downloadReport('short')" 
                class="bg-zinc-800 hover:bg-zinc-700 px-6 py-4 rounded-3xl font-medium flex items-center gap-2">
          <i class="fas fa-download"></i> Short Report
        </button>
        <button onclick="downloadReport('full')" 
                class="bg-zinc-800 hover:bg-zinc-700 px-6 py-4 rounded-3xl font-medium flex items-center gap-2">
          <i class="fas fa-download"></i> Full Report
        </button>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="w-12 h-12 flex items-center justify-center bg-zinc-900 hover:bg-zinc-800 rounded-2xl text-2xl">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>
      </div>
    </div>

    <!-- Results Area -->
    <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- JS llenará aquí -->
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('light');
    }

    function runFullDemo() {
      const results = document.getElementById('results');
      results.classList.remove('hidden');
      results.innerHTML = `
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <h3 class="text-emerald-400 font-medium">Player #87421</h3>
          <p class="text-6xl font-bold text-red-500 mt-4">92</p>
          <p class="text-zinc-400 mt-2">Chip Dumping + Alias Network Detected</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <h3 class="text-emerald-400 font-medium">Player #31902</h3>
          <p class="text-6xl font-bold text-amber-400 mt-4">85</p>
          <p class="text-zinc-400 mt-2">Session Tilt - RG Intervention Recommended</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8">
          <h3 class="text-emerald-400 font-medium">Player #65219</h3>
          <p class="text-6xl font-bold text-purple-400 mt-4">71</p>
          <p class="text-zinc-400 mt-2">Promo Rail Stack + Syndicate Pattern</p>
        </div>
      `;
    }

    function downloadReport(type) {
      const name = type === 'short' ? 'MAZAShield_Short_Report.pdf' : 'MAZAShield_Full_Report.pdf';
      alert(`Descargando ${name}...\n\n(PDF blanco con páginas numeradas - listo para producción)`);
    }
  </script>
</body>
</html>
