<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZAShield • Casino Risk Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Light Mode - Intense Off-White */
    .light { 
      background-color: #f8f7f0 !important; 
      color: #1f2529 !important; 
    }
    .light .bg-zinc-900, .light .bg-zinc-800, .light .bg-black { 
      background-color: #f0ede4 !important; 
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen transition-all">

  <!-- Ribbon -->
  <div class="bg-zinc-900 border-b border-zinc-700 py-3 text-center">
    <div class="inline-flex items-center gap-3 text-2xl font-light tracking-widest">
      <span class="font-bold">MAZAShield</span>
      <span class="text-xs text-zinc-500 align-super">by MAZALab</span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto p-8">
    <div class="flex justify-between items-end mb-12">
      <div>
        <h1 class="text-7xl font-bold tracking-tighter">MAZAShield</h1>
        <p class="text-2xl text-zinc-400 mt-1">Casino Risk Intelligence • Live Operations</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Language -->
        <select onchange="setLang(this.value)" class="bg-zinc-900 border border-zinc-700 rounded-3xl px-6 py-3 text-white">
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="pt">PT</option>
        </select>

        <!-- Theme -->
        <button onclick="toggleTheme()" class="w-12 h-12 flex items-center justify-center bg-zinc-900 hover:bg-zinc-800 rounded-2xl text-2xl transition-all">
          <i id="theme-icon" class="fas fa-moon"></i>
        </button>

        <!-- Download -->
        <button onclick="toggleDownloadMenu()" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-4 rounded-3xl font-medium flex items-center gap-2 transition">
          <i class="fas fa-download"></i> Download Report
        </button>

        <!-- Run Demo -->
        <button onclick="runFullDemo()" class="bg-zinc-700 hover:bg-zinc-600 px-8 py-4 rounded-3xl font-semibold flex items-center gap-3 transition">
          <i class="fas fa-play"></i> RUN FULL DEMO
        </button>
      </div>
    </div>

    <!-- Real-time Status -->
    <div class="bg-zinc-900 border border-emerald-500/30 rounded-3xl px-6 py-4 flex items-center justify-between mb-8 text-sm">
      <div class="flex items-center gap-8">
        <div><span class="text-emerald-400">●</span> Engine Connected</div>
        <div>Latency: <span class="text-emerald-400">387 ms</span></div>
        <div>Last assessment: <span id="seconds-ago">14</span> seconds ago</div>
      </div>
    </div>

    <!-- KPI Strip -->
    <div id="kpi-strip" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12"></div>

    <!-- Player Cards -->
    <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    <!-- Adaptive Combos -->
    <div class="mt-16">
      <h2 class="text-2xl font-semibold mb-6">Adaptive Combos Detected</h2>
      <div id="combos-panel" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
    </div>

    <!-- Operator Playbook -->
    <div class="mt-16">
      <h2 class="text-2xl font-semibold mb-6">Operator Playbook</h2>
      <div id="playbook-panel" class="space-y-4"></div>
    </div>

    <!-- Audit Log -->
    <div class="mt-16">
      <h2 class="text-2xl font-semibold mb-6">Audit Log Live Feed</h2>
      <div id="audit-feed" class="bg-zinc-900 rounded-3xl p-6 max-h-96 overflow-auto text-sm"></div>
    </div>
  </div>

  <script>
    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light');
      const icon = document.getElementById('theme-icon');
      icon.classList.toggle('fa-moon');
      icon.classList.toggle('fa-sun');
    }

    function toggleDownloadMenu() {
      const choice = confirm("1 = Brief Report\n2 = Full Report\n\nChoose 1 or 2:");
      if (choice) alert(`✅ ${choice === "1" ? "Brief" : "Full"} Report generated.`);
    }

    function runFullDemo() {
      document.getElementById('results').classList.remove('hidden');
      document.getElementById('results').innerHTML = `
        <div class="bg-zinc-900 border border-amber-500/30 rounded-3xl p-8">
          <h3 class="text-2xl font-semibold">Marcus Vega</h3>
          <p class="text-5xl font-bold text-amber-400 mt-2">94</p>
          <p class="text-zinc-400">Promo Rail Stack + Velocity Spike</p>
          <button onclick="alert('Playbook opened')" class="mt-6 w-full py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Ver Playbook</button>
        </div>
        <div class="bg-zinc-900 border border-red-500/30 rounded-3xl p-8">
          <h3 class="text-2xl font-semibold">Elena Frost</h3>
          <p class="text-5xl font-bold text-red-400 mt-2">91</p>
          <p class="text-zinc-400">Session Tilt + RG Breach</p>
          <button onclick="alert('Playbook opened')" class="mt-6 w-full py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Ver Playbook</button>
        </div>
      `;
    }
  </script>
</body>
</html>
