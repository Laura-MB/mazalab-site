# Validates commit messages on pull requests (Conventional Commits).
# Local enforcement: Husky commit-msg hook (Windows: use Git Bash / Git for Windows).

name: Changelog / Conventional Commits

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          commitDepth: 50
